name: Проверка BPMN-комплекта

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bpmn-validation:
    name: verify:ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Chrome предустановлен в образе раннера. Задание выполняется не от root,
      # поэтому песочница браузера остаётся включённой и флаг --no-sandbox не нужен.
      BPMN_CHROME_PATH: /usr/bin/google-chrome
    steps:
      - name: Получить исходники
        uses: actions/checkout@v4

      - name: Подготовить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/bpmn/package-lock.json

      - name: Проверить браузер для отрисовки и браузерных тестов
        run: |
          test -x "$BPMN_CHROME_PATH" || {
            echo "Браузер не найден: $BPMN_CHROME_PATH"
            exit 1
          }
          "$BPMN_CHROME_PATH" --version

      - name: Установить зависимости
        working-directory: tools/bpmn
        run: npm ci

      - name: Запустить проверку
        working-directory: tools/bpmn
        run: npm run verify:ci
